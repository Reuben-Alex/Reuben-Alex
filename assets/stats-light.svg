<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="118" viewBox="0 0 1200 118" role="img" aria-label="80% faster IT ticket closure. About $600K saved on leases. 45% lower handle time for 1,000+ support agents. 3rd of 245 in the Arize track of the Google Cloud Rapid Agent Hackathon.">
