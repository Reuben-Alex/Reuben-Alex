<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="Reuben Alex. Associate AI/ML Engineer. I build AI agents in production, and I make them show their work.">
  <style>
    .sans { font-family: Inter, "Inter Tight", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif; }
    .mono { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .ring { fill: none; stroke: #8e949e; stroke-width: 1; opacity: .3; transform-box: fill-box; transform-origin: center; animation: ping 2.4s cubic-bezier(0, 0, .2, 1) infinite; }
    .accent { fill: none; stroke: #5b8cff; stroke-width: 1; opacity: .25; animation: pulse 3s ease-in-out infinite; }
    .line { opacity: 0; animation: cycle 10.5s infinite; }
    .l2 { animation-delay: 3.5s; }
    .l3 { animation-delay: 7s; }
    @keyframes ping { 75%, 100% { transform: scale(2); opacity: 0; } }
    @keyframes pulse { 50% { opacity: .6; } }
    @keyframes cycle { 0% { opacity: 0; } 4%, 29% { opacity: 1; } 33.3%, 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .ring, .accent { animation: none; }
      .line { animation: none; }
      .l1 { opacity: 1; }
    }
  </style>
  <defs>
    <clipPath id="card"><rect width="1200" height="340" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#card)">
    <rect width="1200" height="340" fill="#0b0c0e"/>
    <circle class="ring" cx="600" cy="170" r="60"/>
    <circle class="ring" cx="600" cy="170" r="95"/>
    <circle class="ring" cx="600" cy="170" r="140"/>
    <circle class="ring" cx="600" cy="170" r="210"/>
    <circle class="accent" cx="600" cy="170" r="150"/>

    <text class="sans" x="600" y="112" text-anchor="middle" font-size="13" letter-spacing="6" fill="#8e949e">ASSOCIATE AI/ML ENGINEER</text>
    <g class="sans" text-anchor="middle" font-size="56" font-weight="600" letter-spacing="-1.5" fill="#eceef1">
      <text class="line l1" x="600" y="184">Hi, I'm Reuben Alex</text>
      <text class="line l2" x="600" y="184">I build AI agents in production</text>
      <text class="line l3" x="600" y="184">I make them show their work</text>
    </g>
    <text class="sans" x="600" y="232" text-anchor="middle" font-size="18" fill="#8e949e">Forward-deployed at 66degrees, a Google Cloud AI Partner of the Year</text>
    <text class="mono" x="600" y="276" text-anchor="middle" font-size="12" letter-spacing="3" fill="#8e949e">REUBENALEX.VERCEL.APP</text>
  </g>
  <rect x=".5" y=".5" width="1199" height="339" rx="16" fill="none" stroke="#272b33"/>
</svg>
