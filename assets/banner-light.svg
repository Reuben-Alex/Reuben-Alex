<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Reuben Alex. AI/ML engineer. I build AI agents that run inside real enterprise systems.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#eef2f7"/></linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0f766e" stop-opacity="0"/><stop offset=".5" stop-color="#0f766e" stop-opacity=".9"/><stop offset="1" stop-color="#0f766e" stop-opacity="0"/></linearGradient>
    <style>
      .m{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace} .s{font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif}
      .span{animation:grow 1.2s cubic-bezier(.2,.7,.2,1) both;transform-box:fill-box;transform-origin:left center}
      .d2{animation-delay:.3s} .d3{animation-delay:.6s} .d4{animation-delay:.9s} .d5{animation-delay:1.2s}
      .tick{animation:fade .4s ease-out both} .t2{animation-delay:1.6s}
      .cur{animation:blink 1.1s steps(1) infinite}
      @keyframes grow{from{transform:scaleX(0);opacity:0}to{transform:scaleX(1);opacity:1}}
      @keyframes fade{from{opacity:0}to{opacity:1}}
      @keyframes blink{50%{opacity:0}}
      @media (prefers-reduced-motion:reduce){.span,.tick,.cur{animation:none}}
    </style>
  </defs>
  <rect width="1200" height="300" rx="16" fill="url(#bg)"/>
  <path d="M60 0V300M300 0V300M540 0V300M780 0V300M1020 0V300" stroke="#e2e8f0"/>
  <text x="60" y="76" class="m" font-size="15" fill="#0f766e">trace_id: reuben-alex · span: career · status: <tspan font-weight="700">OK</tspan></text>
  <text x="60" y="130" class="s" font-size="50" font-weight="700" fill="#0f172a" letter-spacing="-1">Reuben Alex</text>
  <text x="60" y="168" class="s" font-size="21" fill="#475569">AI/ML engineer · I build AI agents that run inside real enterprise systems<tspan class="cur" fill="#0f766e">▍</tspan></text>
  <g class="m" font-size="12">
    <rect class="span" x="60" y="200" width="1080" height="15" rx="3" fill="#dbeafe"/><text x="68" y="211" fill="#1e3a8a">agent.run</text>
    <text x="1132" y="211" fill="#1e3a8a" text-anchor="end">2023 → now</text>
    <rect class="span d2" x="120" y="222" width="250" height="15" rx="3" fill="#0f766e"/><text x="128" y="233" fill="#ecfeff">parse</text>
    <rect class="span d3" x="380" y="222" width="300" height="15" rx="3" fill="#7c3aed"/><text x="388" y="233" fill="#f5f3ff">reason · tools</text>
    <rect class="span d4" x="690" y="222" width="250" height="15" rx="3" fill="#b45309"/><text x="698" y="233" fill="#fffbeb">verify</text>
    <rect class="span d5" x="950" y="222" width="190" height="15" rx="3" fill="#be123c"/><text x="958" y="233" fill="#fff1f2">human review</text>
  </g>
  <rect x="60" y="260" width="1080" height="1" fill="url(#glow)"/>
  <text x="60" y="283" class="m" font-size="13" fill="#64748b">Google ADK · Vertex AI · Gemini · evals &amp; observability · Bengaluru, India</text>
</svg>
