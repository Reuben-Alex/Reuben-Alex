<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Reuben Alex. AI/ML engineer. I build AI agents that run inside real enterprise systems.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#111a2e"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#5eead4" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#5eead4" stop-opacity="0"/>
    </linearGradient>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .span { animation: grow 1.4s ease-out both; transform-box: fill-box; transform-origin: left center; }
      .s2 { animation-delay: .25s } .s3 { animation-delay: .5s } .s4 { animation-delay: .75s } .s5 { animation-delay: 1s }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      @keyframes grow { from { transform: scaleX(0); opacity: 0 } to { transform: scaleX(1); opacity: 1 } }
      @keyframes blink { 50% { opacity: 0 } }
      @media (prefers-reduced-motion: reduce) { .span, .cursor { animation: none } }
    </style>
  </defs>

  <rect width="1200" height="300" rx="16" fill="url(#bg)"/>
  <g stroke="#1e2a44" stroke-width="1">
    <path d="M60 0V300M300 0V300M540 0V300M780 0V300M1020 0V300"/>
  </g>

  <text x="60" y="78" class="mono" font-size="15" fill="#5eead4">trace_id: reuben-alex · status: OK</text>
  <text x="60" y="132" class="sans" font-size="48" font-weight="700" fill="#f1f5f9">Reuben Alex</text>
  <text x="60" y="170" class="sans" font-size="21" fill="#94a3b8">AI/ML engineer · I build AI agents that run inside real enterprise systems<tspan class="cursor" fill="#5eead4">▍</tspan></text>

  <g class="mono" font-size="12">
    <rect class="span" x="60"  y="204" width="1080" height="14" rx="3" fill="#1e3a5f"/>
    <text x="68" y="215" fill="#cbd5e1">agent.run</text>

    <rect class="span s2" x="120" y="226" width="260" height="14" rx="3" fill="#0f766e"/>
    <text x="128" y="237" fill="#ecfeff">parse</text>
    <rect class="span s3" x="390" y="226" width="300" height="14" rx="3" fill="#7c3aed"/>
    <text x="398" y="237" fill="#f5f3ff">reason · tools</text>
    <rect class="span s4" x="700" y="226" width="250" height="14" rx="3" fill="#b45309"/>
    <text x="708" y="237" fill="#fffbeb">verify</text>
    <rect class="span s5" x="960" y="226" width="180" height="14" rx="3" fill="#be123c"/>
    <text x="968" y="237" fill="#fff1f2">human review</text>
  </g>

  <rect x="60" y="262" width="1080" height="1" fill="url(#glow)"/>
  <text x="60" y="284" class="mono" font-size="13" fill="#64748b">Google ADK · Vertex AI · Gemini · evals &amp; observability · Bengaluru, India</text>
</svg>
